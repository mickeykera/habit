name: Build IPA & APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          mkdir -p Resources/Fonts
          xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild \
            -project HabitTracker.xcodeproj \
            -scheme HabitTracker \
            -resolvePackageDependencies

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project HabitTracker.xcodeproj \
            -scheme HabitTracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -name "HabitTracker.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: HabitTracker.app not found in build products"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          rm -rf Payload HabitTracker.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r HabitTracker.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-iOS-IPA
          path: HabitTracker.ipa
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        working-directory: android
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle wrapper --gradle-version 8.7
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate and Stage APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found in android build outputs"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" HabitTracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-Android-APK
          path: HabitTracker.apk
          if-no-files-found: error
