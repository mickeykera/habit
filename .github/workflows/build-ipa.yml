name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme HabitTracker

      - name: Build
        run: |
          xcodebuild \
            -scheme HabitTracker \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/HabitTracker.app Payload/
          zip -r HabitTracker.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker
          path: HabitTracker.ipa
