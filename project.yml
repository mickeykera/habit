name: HabitTracker

options:
  bundleIdPrefix: com.habittracker
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

targets:
  HabitTracker:
    type: application
    platform: iOS
    sources:
      - Sources/
    resources:
      - Resources/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habittracker.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      properties:
        UIAppFonts:
          - HostGrotesk-Regular.ttf
          - HostGrotesk-Medium.ttf
          - HostGrotesk-SemiBold.ttf
          - HostGrotesk-Bold.ttf
    dependencies:
      - package: supabase-swift
        product: Supabase
    entitlements:
      properties: {}
